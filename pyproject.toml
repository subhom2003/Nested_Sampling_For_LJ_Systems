[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ljns"
version = "1.0.0"
description = "Lennard-Jones bulk-fluid T-rho phase diagram via NVT Nested Sampling"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [{name = "Nested Sampling LJ Team"}]
dependencies = [
    "numpy>=1.17",
    "scipy>=1.3",
    "matplotlib>=2.2",
    "joblib>=0.14",
]

[project.optional-dependencies]
test = ["pytest>=5.0"]

[project.scripts]
ljns = "ljns.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ljns = ["py.typed"]
